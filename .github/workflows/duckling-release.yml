name: Duckling binaries

on:
  push:
    tags: ['duckling-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          rustup target add '${{ matrix.target }}'
          cargo build --release --locked --manifest-path duckling-cli/Cargo.toml --target '${{ matrix.target }}'
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#duckling-v}"
          asset="org-natural-dates-duckling-${version}-${{ matrix.target }}${{ matrix.extension }}"
          cp 'duckling-cli/target/${{ matrix.target }}/release/org-natural-dates-duckling${{ matrix.extension }}' "dist/$asset"
          python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); p.with_name(p.name+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")' "dist/$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: duckling-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: duckling-*
          path: dist
          merge-multiple: true
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Duckling helper ${GITHUB_REF_NAME#duckling-v}" --notes "Local helper binaries and SHA-256 checksums. Install with M-x org-natural-dates-duckling-install. Linux binaries require glibc 2.35 or newer; macOS binaries require macOS 11 or newer."
